<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>FITCS Faculty Feedback</title>

<link rel="stylesheet"
      href="style.css">

</head>


<body class="dashboard-page">


<header class="top-header">

<div class="header-content">


<div class="header-brand">

<div class="small-logo">
FITCS
</div>

<div>

<h2>
Faculty Feedback
</h2>

<span>
Feedback Dashboard
</span>

</div>

</div>


<button
id="logoutButton"
class="logout-button">

Logout

</button>


</div>

</header>



<main class="dashboard-container">


<!-- FACULTY PROFILE -->

<section class="welcome-card">


<div>

<p class="welcome-label">
Welcome
</p>


<h1 id="facultyName">
Faculty
</h1>


<p>
MIS ID:
<strong id="facultyMis">-</strong>
</p>


<p>
Category:
<strong id="facultyCategory">-</strong>
</p>


<p>
Role:
<strong id="facultyRole">-</strong>
</p>


</div>


<div
class="profile-circle"
id="profileInitial">

F

</div>


</section>



<!-- OBSERVER SECTION -->

<section
id="observerSection"
class="observer-section hidden">


<div class="section-heading">

<div>

<h2>
Observer Panel
</h2>

<p>
Give feedback to another faculty member
</p>

</div>

</div>


<div class="observer-form">

<label for="facultySelect">
    Select Faculty
</label>

<input
    type="text"
    id="facultySelect"
    list="facultyOptions"
    placeholder="Search faculty name or MIS ID..."
    autocomplete="off"
>

<datalist id="facultyOptions">
    <!-- Faculty options will be added by JavaScript -->
</datalist>

<input
    type="hidden"
    id="facultySelectValue"
>



<label for="observerFeedback">

Feedback

</label>


<textarea
id="observerFeedback"
rows="6"
placeholder="Enter your observation / feedback..."
></textarea>


<button
id="submitFeedback"
class="submit-feedback-button">

Submit Feedback

</button>


<div
id="observerMessage"
class="message hidden">
</div>


</div>

</section>

<br>
<br>
<br>

<!-- FEEDBACK -->

<section class="feedback-section">


<div class="section-heading">


<div>

<h2>
Your Feedback
</h2>

<p>
Feedback received from observers
</p>

</div>


<span
id="feedbackCount"
class="feedback-count">

0 Feedback

</span>


</div>



<div
id="feedbackLoading"
class="dashboard-loading">

Loading your feedback...

</div>



<div
id="feedbackMessage"
class="message hidden">
</div>



<div
id="feedbackContainer"
class="feedback-list">

</div>


</section>


</main>



<footer class="dashboard-footer">

FITCS Faculty Feedback System

</footer>



<script src="config.js"></script>

<script src="dashboard.js"></script>


</body>

</html>
